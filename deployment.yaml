
apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskflow-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskflow

  template:
    metadata:
      labels:
        app: taskflow

    spec:
      containers:
        - name: taskflow-container
          image: taskflow-react:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5173
